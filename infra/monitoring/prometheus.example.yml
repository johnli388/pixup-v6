global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/pixup-alerts.yml
scrape_configs:
  - job_name: pixup
    metrics_path: /v1/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/pixup-monitoring-token
    static_configs:
      - targets: ['127.0.0.1:4000']
# Configure deployment-specific TLS, network access and Alertmanager receivers.
# No external notifications are sent by the repository's local default.
