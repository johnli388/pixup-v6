services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: pixup
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: pixup
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pixup-postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pixup -d pixup']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pixup-postgres:
